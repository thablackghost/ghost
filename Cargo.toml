[workspace]
resolver = "2"
members = ["programs/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anchor-lang = "1.2.1"
anchor-spl = "0.30.1"
spl-token-2022 = { version = "1.0", features = ["no-entrypoint"] }
borsh = { version = "1.5", features = ["derive"] }
sha2 = "0.10"
solana-program = "1.18"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1